<div class="form_container">
  <h3 class="form_title">Registro de Usuario</h3>
  <div class="input_container">
    <label for="name">Nombre:</label>
    <input type="text" id="name" class="input_field" placeholder="Ingresa tu nombre">
  </div>
  <div class="input_container">
    <label for="email">Correo Electrónico:</label>
    <input type="email" id="email" class="input_field" placeholder="Ingresa tu correo">
  </div>
  <div class="input_container">
    <label for="password">Contraseña:</label>
    <input type="password" id="password" class="input_field" placeholder="Ingresa tu contraseña">
  </div>
  <button type="submit" class="sign-in_btn">Registrar</button>
</div>
